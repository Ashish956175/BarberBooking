server.port=5000

spring.data.mongodb.uri=mongodb://127.0.0.1:27017/barber-booking

# JWT Secret (minimum 256 bits for HMAC-SHA256)
app.jwt.secret=supersecretkey123supersecretkey123supersecretkey123
app.jwt.expiration-ms=2592000000

# File Upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=public/uploads

# Logging
logging.level.com.barber=DEBUG
logging.level.org.springframework.data.mongodb=INFO
